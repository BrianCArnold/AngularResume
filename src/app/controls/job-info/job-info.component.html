<div class="card mb-2 shadow-sm codeDisplay">
  <div class="card-header py-1">
    <div class="row">
      <div class="col-xl-12 col-sm-12 jobAchievementHeader">
        <div class="row">
          <div class="col-sm-7">
            <div class="row">
              <div class="col-sm-12 jobTitleCell">
                <span class="jobTitle text-info">{{ jobModel.title }}</span>
              </div>
              <div class="col-sm-12 jobCompanyCell">
                <span class="jobCompany text-primary">{{ jobModel.company }}</span>
              </div>
            </div>
          </div>
          <div class="col-sm-5 text-right">
            <div class="row codeInfo">
              <div class="col-sm-12 jobLocation text-success font-italic">
                {{ jobModel.location }}
              </div>
              <div class="col-sm-12 jobDate text-success font-italic">
                {{ jobModel.startDate }} - {{ jobModel.endDate }}
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- <div class="col-xl-3 col-lg-4 text-center jobSkillHeader align-bottom">
        <span class="align-bottom">Skills</span>
      </div> -->
    </div>
  </div>
  <div class="card-body py-0">
    <div class="row">
      <div class="col-lg-8 col-sm-8 jobAchievementSection">
        <div class="listContainer">
          <ul class="codeList list-unstyled">
            <li *ngFor="let achievement of jobModel.achievements">
              <span (mouseover)="setExperienceDetail(achievement)" (mouseout)="setExperienceDetail(null)">
                {{ achievement.desc }}
              </span>
              <ul
                *ngIf="achievement.skills && achievement.skills.length > 0"
                class="codeList list-unstyled subList"
              >
                <li *ngFor="let subAchievement of achievement.skills">
                  <span (mouseover)="setExperienceDetail(subAchievement)" (mouseout)="setExperienceDetail(null)">
                    {{ subAchievement.desc }}
                  </span>
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
      <div class="col-lg-4 col-sm-4 overlayContainer jobSkillSection pt-1">

        <div class="overlayDisplay shadow-lg card" [ngClass]="{'on': experienceDetail && experienceDetail.details}">
          <div class="card-header" *ngIf="experienceDetail && experienceDetail.details">
            {{experienceDetail.desc}}
          </div>
          <div class="card-body" *ngIf="experienceDetail && experienceDetail.details">
            {{experienceDetail.details}}
          </div>
        </div>
        <div class="listContainer">
          <ul class="codeList list-unstyled">
            <li *ngFor="let skill of jobModel.skills">
              {{ skill.desc }}
              <ul
                *ngIf="skill.skills && skill.skills.length > 0"
                class="list-unstyled dashList subList"
              >
                <li *ngFor="let subSkill of skill.skills || []">
                  {{ subSkill.desc }}
                </li>
              </ul>
            </li>
          </ul>
        </div>

      </div>
    </div>
  </div>
</div>
