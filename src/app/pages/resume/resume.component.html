<div style="width: 100%;">
  <div class="resumeAll">
    <div class="row d-print-none">

      <h4 class="col-xl-1 col-lg-2 my-1">
      </h4>
      <span class="col-xl-5 col-lg-10 my-1" name="resumeDetail" >&nbsp;</span>

      <h4 class="col-xl-1 col-lg-2 my-1">
      </h4>
      <app-radio-list class="col-xl-5 col-lg-10 my-1" name="display" [(ngModel)]="programmingDisplay"
        [options]="[{ id: true, value: 'Stylized' },{ id: false, value: 'Minimalist' }]">
      </app-radio-list>

    </div>

    <div class="resumePage" [ngClass]="{'calibri': !programmingDisplay}">
      <app-applicant-info [applicant]="applicant" [programmingDisplay]="programmingDisplay" >
      </app-applicant-info>
      <div class="card">
      <div class="card-body">
      <div class="row">
        <div class="col-print-12 col-12" >
          <h2>Experience</h2>
      </div>
      </div>
      <div class="row" style="page-break-inside: avoid;" *ngFor="let jobModel of jobsSource">
        <app-job-info [programmingDisplay]="programmingDisplay" class="col-sm-12" [jobModel]="jobModel"></app-job-info>
      </div>
      </div>
      </div>
      <div class="card">
         <div class="card-body py-2 skillArea sm-small xs-small" [ngClass]="{'tighter': programmingDisplay}">
         <h2>Skills</h2>
          <hr/>
         <div class="row">
           <div class="col-print-6 skillGroup col-lg-6 col-md-6 col-6" *ngFor="let skillArea of applicant.skillAreas">
             <div class="col-sm-12 font-weight-bold">
               {{skillArea.desc}}
             </div>
             <div class="col-sm-12" *ngFor="let skill of skillArea.skills">
               • {{skill.desc}}
             </div>
           </div>
        </div>
      </div>
    </div>

    </div>

</div>

<ng-template #skillChecklist>
  <app-skill-check-list *ngIf="detailLevel == -1"></app-skill-check-list>
</ng-template>
