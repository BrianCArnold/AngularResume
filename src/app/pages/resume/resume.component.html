<div style="width: 100%;">
  <div class="resumeAll">
    <div class="row d-print-none">
      <div class="col-6 text-center">
        <img src="https://vsrm.dev.azure.com/mercsofscience/_apis/public/Release/badge/3e87fc4e-0bbb-42f5-b0af-d58102c13f95/1/1" />
      </div>
      <div class="col-6 text-center">
        <a class="btn btn-sm btn-primary" href="resume.pdf">
          <fa-icon [icon]="faFilePdf" ></fa-icon>
        </a>
      </div>
    </div>

    <app-applicant-info [applicant]="applicant">
    </app-applicant-info>
    <div class="row">
      <app-job-info class="col-sm-12" *ngFor="let jobModel of jobs" [jobModel]="jobModel"></app-job-info>
    </div>

  </div>

</div>
