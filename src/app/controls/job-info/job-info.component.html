<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col-sm-6">
        <div class="row">
          <div class="col-sm-12">
            <u>{{jobModel.company}}</u>
          </div>
          <div class="col-sm-12">
            {{jobModel.title}}
          </div>
        </div>
      </div>
      <div class="col-sm-6 text-right">
        <div class="row">
          <div class="col-sm-12">
            {{jobModel.location}}
          </div>
          <div class="col-sm-12">
            {{jobModel.startDate}} - {{jobModel.endDate}}
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="card-body">
    <div class="row">
      <div class="col-xl-8">
        <ul>
          <li *ngFor="let achievement of jobModel.achievements">
            {{achievement.desc}}
            <ol *ngIf="achievement.sub && achievement.sub.length > 0">
              <li *ngFor="let subAchievement of achievement.sub">
                {{subAchievement.desc}}
              </li>
            </ol>
          </li>
        </ul>
      </div>
      <div class="col-xl-4">
        <ul>
          <li *ngFor="let skill of jobModel.skills">
            {{skill.desc}}
            <ul *ngIf="skill.sub && skill.sub.length > 0">
              <li *ngFor="let subSkill of skill.sub || []">
                {{subSkill.desc}}
              </li>
            </ul>

          </li>

        </ul>

        <!-- <ng-container *ngFor="let skill  of jobModel.skills">
          <div >
            {{skill.desc}}
          </div>
          <ng-container *ngFor="let subskill of skill.sub">
            <div >
              {{subskill.desc}}
            </div>
          </ng-container>
        </ng-container> -->

      </div>
    </div>
  </div>
  <div class="card-footer"></div>
</div>
