<div class="card mb-2 shadow-sm codeDisplay">
  <div class="card-header py-1">
    <div class="row">
      <div class="col-xl-12 col-print-12 col-lg-12 col-md-12 col-sm-12 jobAchievementHeader">
        <div class="row">
          <div class="col-sm-7">
            <div class="row">
              <div class="col-sm-12 jobTitleCell md-small">
                <span class="jobTitle text-info">{{ jobModel.title }}</span>
              </div>
              <div class="col-sm-12 jobCompanyCell md-small">
                <span class="jobCompany text-primary">{{ jobModel.company }}</span>
              </div>
            </div>
          </div>
          <div class="col-sm-5 text-right">
            <div class="row codeInfo">
              <div class="col-sm-12 jobLocation text-success font-italic md-small">
                {{ jobModel.location }}
              </div>
              <div class="col-sm-12 jobDate text-success font-italic md-small">
                {{ jobModel.startDate }} - {{ jobModel.endDate }}
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- <div class="col-xl-3 col-lg-4 text-center jobSkillHeader align-bottom">
        <span class="align-bottom">Skills</span>
      </div> -->
    </div>
  </div>
  <div class="card-body py-0">
    <div class="row">
      <div class="col-xl-8 col-lg-9 py-1 col-print-8 jobAchievementSection" (mouseout)="setExperienceDetail(null)">
        <div class="listContainer">
          <ul class="codeList list-unstyled">
            <li *ngFor="let achievement of jobModel.achievements">
              <span (mouseover)="setExperienceDetail(achievement)"
                (click)="clickExperienceDetail(achievement)"
                [ngClass]="{'hasDetails': achievement && achievement.details}">
                {{ achievement.desc }}<sup class="hasDetailsInfo d-print-none" *ngIf="achievement && achievement.details">i</sup>
              </span>
              <ul
                *ngIf="achievement.skills && achievement.skills.length > 0"
                class="codeList list-unstyled subList"
              >
                <li *ngFor="let subAchievement of achievement.skills">
                  <span (mouseover)="setExperienceDetail(subAchievement)"
                    (click)="clickExperienceDetail(subAchievement)"
                  [ngClass]="{'hasDetails': subAchievement && subAchievement.details}">
                    {{ subAchievement.desc }}<sup class="hasDetailsInfo d-print-none" *ngIf="subAchievement && subAchievement.details">i</sup>
                  </span>
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
      <div class="col-xl-4 col-lg-3 py-1 col-print-4 overlayContainer jobSkillSection">
        <div class="overlayDisplay d-sm-none d-xl-block shadow-lg card" *ngIf="experienceDetail" [ngClass]="{'on': showExperienceDetail && experienceDetail && experienceDetail.details}">
          <app-experience-details [experienceDetail]="experienceDetail"></app-experience-details>
        </div>
        <div class="listContainer">
          <ul class="codeList list-unstyled">
            <li *ngFor="let skill of jobModel.skills">
              {{ skill.desc }}
              <ul *ngIf="skill.skills && skill.skills.length > 0" class="list-unstyled dashList subList" >
                <li *ngFor="let subSkill of skill.skills || []">
                  {{ subSkill.desc }}
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #modalDetails>
  <app-experience-details [experienceDetail]="experienceDetail"></app-experience-details>
</ng-template>
