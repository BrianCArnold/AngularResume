<div class="card">
  <div class="card-header blockComment">
    <strong>{{experienceDetail.desc}}</strong>
  </div>
  <div class="card-body">
    <ul class="list-unstyled singleColumn">
      <li class="indentFirstLine" *ngFor="let detail of experienceDetail.details">
        {{detail}}
      </li>
    </ul>
  </div>
</div>
